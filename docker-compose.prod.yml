# =============================================================================
# Production compose — used by scripts/deploy-to-vps.sh
# =============================================================================
#
# Same topology as the local dev compose (docker-compose.yml) but with
# production-only hardening:
#   - No db port mapping (internal Docker network only — db is unreachable
#     from the internet by design).
#   - Named volume for share-cards (survives container recreate; deploys
#     can pre-render PNGs into the volume via `npm run share:render`).
#   - TLS + ACME handled by Traefik (already running on the VPS host per
#     the ai-billing-audit setup pattern). The Caddy container serves
#     plain HTTP on :80 internally — Traefik terminates TLS on :443 and
#     reverse-proxies to it via the Docker network using these labels.
#   - Resource limits on every service.
#   - Restart policies tuned for unattended operation.
#   - json-file log rotation (10m × 3 files).
#
# Differences from `docker-compose.yml`:
#   - db: NO ports exposed (production must not expose Postgres)
#   - api: named volume for share-cards (NOT bind mount); Traefik labels
#     so /api/* routes to api:8000 directly
#   - web: NO host ports — Traefik labels route workout.ashbi.ca →
#     web:80 internally. Caddy in-container just serves static +
#     /api/* reverse-proxy (same as dev).
#   - all services: resource limits + restart: unless-stopped
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs --tail=100 api
#   docker compose -f docker-compose.prod.yml stop api      # zero-downtime
#   docker compose -f docker-compose.prod.yml up -d api    # restart
#
# Environment variables are sourced from /root/calisthenicstree-secrets/.env
# by scripts/deploy-to-vps.sh — never inline secrets into this file.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calisthenics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-calisthenics}
    volumes:
      - calisthenics_pgdata:/var/lib/postgresql/data
    # No `ports:` — db is on the internal Docker network only.
    # Reaching Postgres from outside requires `ssh … docker compose exec db psql`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calisthenics} -d ${POSTGRES_DB:-calisthenics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-calisthenics}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-calisthenics}
      BEARER_TOKEN: ${BEARER_TOKEN}
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      POSTMARK_FROM_EMAIL: ${POSTMARK_FROM_EMAIL:-hello@workout.ashbi.ca}
      WEB_BASE_URL: ${WEB_BASE_URL:-https://workout.ashbi.ca}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SHARE_DIR: /srv/share
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - calisthenics_share:/srv/share
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    # Host port mapping (matches the ai-billing-audit pattern on the
    # same VPS). Traefik reaches the web container via 127.0.0.1:3020.
    # The host port (3020) is intentionally NOT 80/443 — Traefik owns
    # those for ACME + the multi-app routing layer. The web container's
    # Caddy then reverse-proxies /api/* → api:8000 over the internal
    # Docker network so the SPA never sees a cross-origin API base URL.
    ports:
      - "127.0.0.1:3020:80"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  calisthenics_pgdata:
  calisthenics_share:

# -----------------------------------------------------------------------------
# Traefik dynamic config snippet for this app — to enable routing,
# append the following routers + services to
# /opt/traefik/dynamic/routers.yml (merge with the existing entries;
# do NOT replace the whole file — see the previous-session gotcha
# about heredoc-YAML overwrites silently dropping keys).
#
# Routers:
#   workout-web:
#     rule: Host(`workout.ashbi.ca`)
#     entryPoints: [websecure]
#     service: workout-web
#     tls: { certResolver: letsencrypt }
#
# Services:
#   workout-web:
#     loadBalancer:
#       servers:
#       - url: http://127.0.0.1:3020
#
# Optional: also add a www→apex redirect:
#   workout-www-redirect:
#     rule: Host(`www.workout.ashbi.ca`)
#     entryPoints: [websecure]
#     middlewares: [redirect-to-apex]
#     service: workout-web
#     tls: { certResolver: letsencrypt }
#
# (redirect-to-apex middleware defined elsewhere in routers.yml.)
# -----------------------------------------------------------------------------