# =============================================================================
# Production compose — used by scripts/deploy-to-vps.sh
# =============================================================================
#
# Same topology as the local dev compose (docker-compose.yml) but with
# production-only hardening:
#   - No db port mapping (internal Docker network only — db is unreachable
#     from the internet by design).
#   - Named volume for share-cards (survives container recreate; deploys
#     can pre-render PNGs into the volume via `npm run share:render`).
#   - Caddy runs with CADDY_DOMAIN=calisthenics-tree.com → ACME TLS +
#     HSTS + X-Content-Type-Options + X-Frame-Options + Referrer-Policy
#     security headers baked into every response.
#   - Resource limits so a runaway api can't OOM the VPS.
#   - Restart policies tuned for unattended operation.
#
# Differences from `docker-compose.yml`:
#   - db: NO ports exposed (production must not expose Postgres)
#   - api: named volume for share-cards (NOT bind mount)
#   - web: CADDY_DOMAIN set → ACME; binds 80 + 443 (ACME challenge)
#   - all services: resource limits + restart: unless-stopped
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs --tail=100 api
#   docker compose -f docker-compose.prod.yml stop api      # zero-downtime
#   docker compose -f docker-compose.prod.yml up -d api    # restart
#
# Environment variables are sourced from /root/calisthenicstree-secrets/.env
# by scripts/deploy-to-vps.sh — never inline secrets into this file.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calisthenics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-calisthenics}
    volumes:
      - calisthenics_pgdata:/var/lib/postgresql/data
    # No `ports:` — db is on the internal Docker network only.
    # Reaching Postgres from outside requires `ssh … docker compose exec db psql`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calisthenics} -d ${POSTGRES_DB:-calisthenics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-calisthenics}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-calisthenics}
      BEARER_TOKEN: ${BEARER_TOKEN}
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      POSTMARK_FROM_EMAIL: ${POSTMARK_FROM_EMAIL:-hello@calisthenics-tree.com}
      WEB_BASE_URL: ${WEB_BASE_URL:-https://calisthenics-tree.com}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SHARE_DIR: /srv/share
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - calisthenics_share:/srv/share
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Production: real domain → Caddy activates ACME TLS + security
      # headers (see apps/web/Caddyfile). Email is required for the
      # Let's Encrypt registration; pick an address you monitor.
      CADDY_DOMAIN: ${CADDY_DOMAIN:-calisthenics-tree.com}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    ports:
      - "80:80"   # ACME HTTP-01 challenge
      - "443:443" # TLS termination (Caddy)
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  calisthenics_pgdata:
  calisthenics_share: