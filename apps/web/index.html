<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B1220" />
    <meta
      name="description"
      content="A real skill tree for calisthenics. Unlock planche, front lever, handstand — progression that makes sense."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      T39 — Open Graph + Twitter Card metadata. Points at the static share
      PNG so Slack / iMessage / Twitter / Facebook render a rich preview
      when someone pastes the app URL. The PNG is generated by
      `scripts/render-share.ts` and served at /share/<unlockId>.png.
    -->
    <meta property="og:title" content="Calisthenics Tree — Train smarter, not just harder" />
    <meta property="og:description" content="A real skill tree for calisthenics. Unlock planche, front lever, handstand — progression that makes sense." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/share/tuck-front-lever-001.png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="Just unlocked Tuck Front Lever on Calisthenics Tree" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Calisthenics Tree — Train smarter, not just harder" />
    <meta name="twitter:description" content="A real skill tree for calisthenics." />
    <meta name="twitter:image" content="/share/tuck-front-lever-001.png" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
      crossorigin
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Calisthenics Tree — Train smarter, not just harder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
