<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calisthenics Tree" />
    <meta
      name="description"
      content="A real skill tree for calisthenics. Unlock planche, front lever, handstand — progression that makes sense."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <!--
      T39 — Open Graph + Twitter Card metadata. Points at the static share
      PNG so Slack / iMessage / Twitter / Facebook render a rich preview
      when someone pastes the app URL. The PNG is generated by
      `scripts/render-share.ts` and served at /share/<unlockId>.png.
    -->
    <meta property="og:title" content="Calisthenics Tree — Train smarter, not just harder" />
    <meta property="og:description" content="A real skill tree for calisthenics. Unlock planche, front lever, handstand — progression that makes sense." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/share/tuck-front-lever-001.png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="Just unlocked Tuck Front Lever on Calisthenics Tree" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Calisthenics Tree — Train smarter, not just harder" />
    <meta name="twitter:description" content="A real skill tree for calisthenics." />
    <meta name="twitter:image" content="/share/tuck-front-lever-001.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@75..100,500..800&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Calisthenics Tree — Train smarter, not just harder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the service worker after the page loads. PWA installability
      // requires the SW to be served from the same origin over HTTPS, which
      // workout.ashbi.ca already satisfies (Traefik handles TLS).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => {
              console.info('[pwa] service worker registered, scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('[pwa] service worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
