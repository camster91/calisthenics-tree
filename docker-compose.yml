# =============================================================================
# Local development compose — `docker compose up`
# =============================================================================
#
# For production, see `docker-compose.prod.yml`. The two files are
# deliberately split so local dev stays friendly (db port exposed for
# Postico / pgAdmin, bind mount for share-cards so re-renders are live,
# plain HTTP via Caddy with no ACME), while production uses Traefik for
# TLS termination (workout.ashbi.ca → this stack via Docker labels on
# the web service).
#
# Differences from `docker-compose.prod.yml`:
#   - db exposes 5433:5432 for local Postgres tooling
#   - api mounts `./apps/web/public/share` as a bind mount (re-rendering
#     a share card on the host immediately reflects in the container)
#   - web binds :80 only (no ACME challenge on 443 needed locally)
#   - no resource limits (let the dev machine breathe)
#   - no Traefik labels (local dev doesn't use Traefik)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calisthenics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-calisthenics}
    volumes:
      - calisthenics_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # local Postgres tooling (Postico, pgAdmin, etc.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calisthenics} -d ${POSTGRES_DB:-calisthenics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-calisthenics}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-calisthenics}
      BEARER_TOKEN: ${BEARER_TOKEN:-dev-bearer-token-replace-me}
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-in-production-use-secrets-token-urlsafe-64}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET:-dev-magic-link-secret-change-me-in-production}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      POSTMARK_FROM_EMAIL: ${POSTMARK_FROM_EMAIL:-hello@calisthenics-tree.com}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SHARE_DIR: /srv/share
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/web/public/share:/srv/share  # bind mount: host re-renders show up live
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    # No CADDY_DOMAIN env needed in dev — the Caddyfile uses :80
    # directly (no TLS, no env-driven mode switch). Production uses
    # Traefik for TLS termination, see docker-compose.prod.yml.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    ports:
      - "80:80"  # local HTTP only — no 443 (ACME) in dev

volumes:
  calisthenics_pgdata: